name: Proton 11 ARM64 MappingFix

on:
  push:
    branches: [proton-11-arm64-mappingfix-build]
    paths:
      - .github/workflows/proton-arm64-mappingfix.yml
      - scripts/**
      - patches/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proton-arm64-mappingfix
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Prepare native ARM64 runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          df -h .
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo docker image prune -af
          sudo apt-get update -qq
          sudo apt-get install -y make git python3 rsync file binutils xz-utils
          docker version
          df -h .
      - name: Fetch exact Proton and Wine sources and apply mapping fix
        shell: bash
        run: bash scripts/build.sh sources
      - name: Configure Valve ARM64 SDK
        shell: bash
        run: bash scripts/build.sh configure
      - name: Compile full Proton ARM64 redistributable
        shell: bash
        run: bash scripts/build.sh compile
      - name: Package archive and validate architecture, source, layout and checksum
        shell: bash
        run: bash scripts/build.sh package
      - name: Stress test ARM64EC thread mapping cleanup
        shell: bash
        run: |
          set -euo pipefail
          task_root="$PWD"
          sdk=registry.gitlab.steamos.cloud/proton/steamrt4/sdk/arm64-llvm:4.0.20260331.220802-2
          docker run --rm -v "$task_root:$task_root" -w "$task_root" \
            --entrypoint /bin/bash "$sdk" -lc '
              if x86_64-w64-mingw32-gcc -O2 scripts/thread-churn.c -o logs/thread-churn.exe; then
                python3 scripts/runtime-check.py
              else
                printf "%s\n" "Optional runtime test could not be compiled in this SDK" > logs/thread-churn-unavailable.txt
                echo "::warning::Optional runtime stress test compiler was unavailable."
              fi
            ' 2>&1 | tee logs/thread-churn.log
      - name: Upload validated Proton archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Proton-11-ARM64-MappingFix
          path: |
            output/Proton-11-ARM64-MappingFix.tar.xz
            output/Proton-11-ARM64-MappingFix.tar.xz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Proton-11-ARM64-MappingFix-build-evidence
          path: logs/
          if-no-files-found: ignore
          retention-days: 30
